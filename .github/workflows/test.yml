name: TDR Run Backend Checks Results Tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - release-*
permissions:
  id-token: write
  contents: read
jobs:
  test:
    uses: nationalarchives/tdr-github-actions/.github/workflows/tdr_test.yml@c130d20af544843b70e2a0e1a44759d4fabf3a5d # v.0.0.37
    with:
      repo-name: tdr-backend-checks-results
      test-command: |
        pip install -r requirements-test.txt
        pip install pyopenssl --upgrade
        python -m pytest
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          
